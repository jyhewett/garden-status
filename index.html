<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Garden action status</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:20px auto;padding:0 16px;color:#222}
h1{font-size:22px;margin:0 0 4px}.sub{color:#666;margin:0 0 18px}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:17px;cursor:pointer}
.item input{width:24px;height:24px;margin-top:2px;flex:none}.done{background:#f3f3f3;color:#888}
.who{margin:18px 0 10px;font-size:16px}.who label{margin-right:18px}
button{width:100%;padding:16px;font-size:18px;font-weight:bold;color:#fff;background:#1a7f37;border:0;border-radius:10px}button:disabled{background:#999}
.msg{margin-top:14px;font-size:16px}
</style></head><body>
<h1>🌱 Las Vegas garden – cold protection</h1>
<p class="sub" id="sub">Loading…</p>
<form id="f"></form>
<div class="msg" id="m"></div>
<script>
// Static checklist page. Talks to the Apps Script API with credentials:'omit', so the
// visitor's Google accounts/cookies are never sent and Google's multi-account bug can't trigger.
var API = "https://script.google.com/macros/s/AKfycbxODp6X9Cf5WOiJL1Hf82SvwODcjbKDJLLZDPf8vpc_h-4Q3y-WFmOb4s5-je8iKvTV/exec";
var P = {};
(location.hash.slice(1) || location.search.slice(1)).split("&").forEach(function (kv) {
  var i = kv.indexOf("="); if (i > 0) P[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
});
var f = document.getElementById("f"), m = document.getElementById("m"), sub = document.getElementById("sub");
function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return new TextDecoder().decode(u); }
function b64e(str) { var u = new TextEncoder().encode(str), b = ""; for (var i = 0; i < u.length; i++) b += String.fromCharCode(u[i]);
  return btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function api(params) {
  var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
  var ctl = window.AbortController ? new AbortController() : null;
  var t = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
  return fetch(API + "?" + q, {credentials: "omit", redirect: "follow", cache: "no-store", referrerPolicy: "no-referrer", signal: ctl ? ctl.signal : undefined})
    .then(function (r) { clearTimeout(t); return r.text(); }, function (e) { clearTimeout(t); throw new Error(e && e.name === "AbortError" ? "Google took too long to answer (30 s)" : "Your browser blocked the request to Google (" + (e && e.message) + ")"); })
    .then(function (t) { try { return JSON.parse(t); } catch (e) { return {ok: false, error: "This link is not valid."}; } });
}
var acts = [];
try { acts = JSON.parse(b64d(P.a || "")); } catch (e) { acts = []; }
function render(done) {
  var open = acts.filter(function (x) { return !done[x[0]]; }).length;
  sub.textContent = P.e + (open ? " · tick what you finished, then press Save" : " · all actions are done 🎉");
  f.innerHTML = acts.map(function (x) {
    var d = done[x[0]];
    return d
      ? '<label class="item done"><input type="checkbox" checked disabled> <span><b>' + esc(x[0]) + '.</b> <s>' + esc(x[1]) + '</s><br><small>Done by ' + esc(d.by) + ', ' + esc(d.at) + '</small></span></label>'
      : '<label class="item"><input type="checkbox" name="act" value="' + esc(x[0]) + '" data-t="' + esc(x[1]) + '"> <span><b>' + esc(x[0]) + '.</b> ' + esc(x[1]) + '</span></label>';
  }).join("") + (open ? '<div class="who">Who is updating? <label><input type="radio" name="who" value="jin" required> Jin</label><label><input type="radio" name="who" value="mh"> M</label></div><button id="b" type="submit">Save status</button>' : "");
}
function readWithRetry() {
  // Google's first answer sometimes stalls; fire extra attempts at 6 s and 14 s and use whichever answers first.
  return new Promise(function (resolve, reject) {
    var finished = false, fails = 0, tries = 0;
    function attempt() {
      if (finished) return; tries++;
      if (tries > 1) sub.textContent = "Loading… (try " + tries + ")";
      api({mode: "json", e: P.e, k: P.k, n: Date.now() + "" + tries}).then(function (r) {
        if (!finished) { finished = true; resolve(r); }
      }, function (er) { fails++; if (!finished && fails >= 3) { finished = true; reject(er); } });
    }
    attempt(); setTimeout(attempt, 6000); setTimeout(attempt, 14000);
  });
}
function load() {
  if (!P.e || !P.k || !acts.length) { sub.textContent = "This link is not valid."; return; }
  readWithRetry().then(function (r) {
    if (!r.done) { sub.textContent = r.error || "This link is not valid."; return; }
    render(r.done);
  }).catch(function (er) { sub.textContent = "Could not load this checklist: " + er.message + ". Please reload, or open the link in another browser."; });
}
f.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var c = [].slice.call(f.querySelectorAll("input[name=act]:checked")).map(function (i) { return [i.value, i.getAttribute("data-t")]; });
  var w = f.querySelector("input[name=who]:checked");
  if (!c.length) { m.textContent = "Tick at least one item first."; return; }
  if (!w) { m.textContent = "Choose who is updating."; return; }
  var b = document.getElementById("b"); b.disabled = true; b.textContent = "Saving…"; m.textContent = "";
  api({mode: "save", e: P.e, k: P.k, who: w.value, d: b64e(JSON.stringify(c))}).then(function (r) {
    if (!r.ok) throw new Error(r.error || "Save failed");
    m.textContent = "✅ Saved."; render(r.done);
  }).catch(function (er) { b.disabled = false; b.textContent = "Save status"; m.textContent = "Could not save: " + er.message; });
});
window.addEventListener("hashchange", function () { location.reload(); });
window.onerror = function (msg) { sub.textContent = "Page error: " + msg; };
sub.textContent = "Loading… (contacting Google)";
load();
</script>
</body></html>
